name: Keep Expense System Alive

on:
  schedule:
    - cron: '30,40,50 3 * * *'
    - cron: '*/10 4-13 * * *'
    - cron: '0,10,20 14 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping App and DB
        run: |
          curl -f -s -o /dev/null https://expense-management-system-9nlk.onrender.com/health || exit 1
